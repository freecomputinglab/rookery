# @rookery/pinboard's only in-repo rheo fixture. This repo's own definition
# of lint (CLAUDE.md, "Build") is "the package builds and its demo compiles",
# and without this the package would ship src/, dist/ and test/ with nothing
# exercising the DOM `src/board.typ` actually renders.
version = "0.1.0"
content_dir = "content"
formats = ["html"]

# The Typst cache's `rookery` namespace is a per-machine symlink that can
# point at a different checkout of this repo, so this reads `@rookery/*` out
# of this tree instead. See `slipshow/0.1.0/demo/rheo/rheo.toml` for the full
# argument.
[packages.rookery]
path = "../../../.."
