# Tests and lints. Deliberately NOT folded into publish-packages.yml: a release
# run must not be gated on a demo build, and a pull request needs these checks
# before merge, where the publish workflow only runs on push to main.
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: extractions/setup-just@v3

      # Pinned to the version this repo is developed against, and the one the
      # manifest declares as its `compiler` floor (0.15.0). Installed from the
      # release tarball rather than a third-party action: one pinned URL is
      # easier to audit than an action's own moving parts.
      - name: Install Typst 0.15.1
        run: |
          set -euo pipefail
          curl -fsSL -o typst.tar.xz \
            https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xJf typst.tar.xz
          echo "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      # Pinned to the OLDEST rheo the demo projects need, NOT to the newest
      # rheo: the point is that the DECLARED floor is the floor actually
      # tested, so a package that reaches for a newer surface fails here
      # instead of on a user's machine. rheo reads `min_version` itself and
      # refuses a package above the running version, so this step and that
      # check have to agree — if they drift, one of them is testing a fiction.
      #
      # core declares `min_version = "0.6.2"`, and NOT because the Typst
      # surface moved — it has not since 0.6.0. Three requirements stack up.
      #
      # 0.6.0: `_resolve-dest` (`core/0.1.1/src/urls.typ`) emits a reserved
      # `rheo-page:<handle>` link dest that only 0.6.0 and later rewrite into a
      # depth-correct href; `core/0.1.1/demo/rheo/check.sh` catches the literal an
      # older rheo ships instead.
      #
      # 0.6.1: where rheo learned to resolve a namespace it does not ship, via the
      # `[packages.<ns>]` table a project needs to say where `@rookery` comes from
      # at all — so no older rheo can consume this family under its own namespace.
      #
      # 0.6.2: 0.6.1 still located packages by probing Typst's directory layout in
      # the two places that read a package's `.marrow.typ`, and a package fetched
      # from a ref lives at a path keyed by its resolved commit, which no probe
      # matches. Every page this family mints from marrow went missing, on a build
      # that succeeded and warned about nothing. Since every consumer currently
      # tracks a branch rather than a release, that is the ordinary case here, not
      # an edge one.
      #
      # 0.6.3: where a namespace could first resolve from a directory on disk
      # (`path`), which is what `[packages.rookery] path = "../../../.."` in
      # `core/0.1.1/demo/rheo/rheo.toml` asks for. core's `min_version` stays at
      # 0.6.2 because no package surface moved — the gap is entirely in how the
      # DEMO PROJECT locates `@rookery`, so the version installed here is set by
      # the demo's floor rather than the package's own.
      #
      # Pinned URL AND pinned digest, for the same auditability reason the
      # Typst step gives: a re-uploaded asset fails this step rather than
      # silently changing what CI tested.
      - name: Install rheo 0.6.3 (the floor the demo project needs)
        run: |
          set -euo pipefail
          # Digest of the v0.6.3 rheo-x86_64-unknown-linux-gnu.zip asset, published
          # 2026-09-15. Read it back with (note the exact asset name: matching on
          # "linux-gnu.zip" also catches the aarch64 build, and `digest` comes back
          # "sha256:"-prefixed, which `sha256sum -c` will not accept):
          #   gh release view v0.6.3 --repo freecomputinglab/rheo --json assets \
          #     --jq '.assets[] | select(.name == "rheo-x86_64-unknown-linux-gnu.zip") | .digest' \
          #     | cut -d: -f2
          # BUMP THIS IN THE SAME EDIT AS THE URL BELOW: the `sha256sum -c` is what
          # makes a re-uploaded or wrong-version asset fail here rather than silently
          # changing what CI tested.
          sha256="15c6f8d9b61f37020e252fe97e7ad4fbfb437289b1241f40b56e791bde81d3e0"
          curl -fsSL -o rheo.zip \
            https://github.com/freecomputinglab/rheo/releases/download/v0.6.3/rheo-x86_64-unknown-linux-gnu.zip
          echo "$sha256  rheo.zip" | sha256sum -c -
          unzip -q rheo.zip -d rheo-bin
          chmod +x rheo-bin/rheo
          echo "$PWD/rheo-bin" >> "$GITHUB_PATH"
          rheo-bin/rheo --version   # must print: rheo 0.6.3

      # First, because it is the cheapest failure in the repo and the one that
      # silently ships a broken release: a version directory cut by copying and
      # bumping only the manifest leaves `.marrow.typ` importing its predecessor.
      - name: Package specs agree with their manifests
        run: just check-versions

      - name: core unit fixture
        run: cd core/0.1.1 && just test

      # `@rookery` IS A CUSTOM NAMESPACE, NOT A TYPST-UNIVERSE ONE, so there is
      # no registry to download it from: it resolves only where the package
      # cache already holds it. `core/0.1.1/demo/rheo/native.typ` imports
      # `@rookery/core:0.1.1` by coordinate and is compiled by BARE `typst`,
      # which knows only the cache — so without this the `check-typst` step
      # below dies with
      # `error: package not found (searched for @rookery/core:0.1.1)`.
      #
      # THE WHOLE NAMESPACE, not one package, and this is the same one-line
      # setup CLAUDE.md prescribes for a developer's machine. Linking a single
      # package in is the documented mistake: under a namespace link the target
      # resolves back into the repo, where `<pkg>/` already exists, and
      # `ln -sfn TARGET DIR` then writes the link INSIDE it, leaving a
      # self-referential `<pkg>/<pkg>`.
      #
      # The rheo build needs nothing from the cache: `demo/rheo/rheo.toml`
      # declares `[packages.rookery] path = "../../../.."` and reads the
      # package straight out of this checkout.
      - name: Resolve the @rookery namespace from this checkout
        run: |
          set -euo pipefail
          cache="${XDG_CACHE_HOME:-$HOME/.cache}/typst/packages"
          mkdir -p "$cache"
          ln -s "$PWD" "$cache/rookery"
          # Fail HERE with something legible rather than inside a typst error later.
          test -f "$cache/rookery/core/0.1.1/typst.toml"

      # This repo's definition of "lint" is that a package's demo compiles
      # (CLAUDE.md, "Build"). `demo/pure` is plain `typst compile`, so it runs
      # anywhere. `just build`, not a hand-copied subset of its `typst compile`
      # lines, so a new root added to the Justfile is gated in CI automatically.
      #
      # What's left here is what the rheo demo's own native-Typst build (below)
      # cannot cover: `excluded.typ`'s `--input` pair (`rheo compile` forwards no
      # `--input` at all) and `root-prefix.typ`/`theme.typ`'s non-default
      # `prefix:`/`theme:`, which is document-wide state and cannot share a
      # document with content that hardcodes the default.
      - name: core pure demo compiles and checks, HTML and PDF
        run: cd core/0.1.1/demo/pure && just build

      # The rheo half of core's coverage, and the only thing that proves
      # package-`.marrow.typ` still mints: `check.sh` asserts on the OUTPUT —
      # minted note pages, backlinks, depth-relative hrefs, and the generated
      # `@layer rookery-tags` rules — none of which `demo/pure` can reach.
      - name: core rheo demo compiles and asserts, under the declared floor
        run: cd core/0.1.1/demo/rheo && just check

      # The same content compiled a SECOND way, plain `typst compile`, no
      # rheo — one document, one compile pass, no minted pages — and asserted
      # by `check-native.sh`, not merely compiled. AFTER the namespace-symlink
      # step, because the content imports `@rookery/core:0.1.1` by coordinate.
      - name: core rheo demo's rookery compiles and asserts without rheo too
        run: cd core/0.1.1/demo/rheo && just check-typst
