# A RELEASE IS THE MERGE OF A PULL REQUEST INTO MAIN, and nothing else. Not a push
# to main: `check.yml` runs on a pull request, so gating the release on the merge is
# what puts those checks between a version bump and the tag cut from it. A direct
# push to main therefore publishes NOTHING — advance main by PR, or cut the release
# by hand with `workflow_dispatch`.
name: Publish Packages

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    # `closed` fires whether the pull request merged or was simply abandoned, and
    # only a merge is a release. `workflow_dispatch` carries no `pull_request`
    # payload at all, hence the second arm rather than one combined condition.
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # THE MERGE COMMIT, not the default `pull_request` checkout: that one is a
      # throwaway merge of head into base, computed while the PR was open, and for a
      # PR that has just closed it is neither what was reviewed nor what main now
      # holds. Releases are cut from the tree main actually has. The fallback arm
      # covers `workflow_dispatch`, where there is no pull request to read.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - uses: pnpm/action-setup@v5
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: extractions/setup-just@v3

      - name: Build and release new package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          while IFS= read -r manifest; do
            dir=$(dirname "$manifest")
            name=$(grep '^name = ' "$manifest" | sed 's/name = "\(.*\)"/\1/')
            version=$(grep '^version = ' "$manifest" | sed 's/version = "\(.*\)"/\1/')
            tag="${name}-${version}"

            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" &>/dev/null 2>&1; then
              echo "skip: $tag already released"
              continue
            fi

            echo "build: $name $version"
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && pnpm install --frozen-lockfile && pnpm run build)
            elif grep -qE '^build:' "$dir/Justfile" 2>/dev/null; then
              (cd "$dir" && just build)
            else
              echo "no build step for $name — entrypoint ships straight from src/"
            fi

            # Every package ships src/ — a built package's entrypoint and
            # stylesheet live there now, and dist/ (when present) holds ONLY
            # the JS bundle, so a built package needs BOTH directories.
            #
            # `.marrow.typ` is the third thing a package can ship, and it sits at
            # the package ROOT beside typst.toml rather than under src/ or dist/,
            # because rheo looks for it at exactly `<package>/.marrow.typ`
            # (crates/core/src/plugins/typst_manifest.rs, package_marrow_source).
            # So it has to be named here, and leaving it out fails SILENTLY: that
            # function returns None for a missing marrow rather than erroring, so
            # the package installs, compiles, and simply mints none of the pages
            # it exists to mint. @rookery/core is the first package to ship one.
            #
            # `if` rather than `[ -f ... ] && paths+=(...)`: under `set -e` the
            # && form exits the whole script when the file is absent, which is
            # every other package.
            archive="${tag}.tar.gz"
            paths=(typst.toml)
            if [ -f "$dir/.marrow.typ" ]; then
              paths+=(.marrow.typ)
            fi
            paths+=(src/)
            if [ -d "$dir/dist" ]; then
              paths+=(dist/)
            fi
            tar -czf "$archive" -C "$dir" "${paths[@]}"

            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$name $version" \
              --notes "Typst package \`@rookery/$name:$version\`" \
              "${archive}#${archive}"

            rm "$archive"

          done < <(find . -name typst.toml -not -path './.git/*' | sort)
