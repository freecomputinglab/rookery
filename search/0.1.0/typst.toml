[package]
name = "search"
version = "0.1.0"
compiler = "0.15.0"
entrypoint = "src/lib.typ"
authors = ["The Free Computing Lab <https://freecomputinglab.ohrg.org>"]
license = "MIT"
description = "Fuzzy search over @rookery/core notes — Typst primitive, JSON index, and an embeddable search bar"
repository = "https://github.com/freecomputinglab/rookery"

# THE RHEO FLOOR, not a rookery version. It was `0.5.2` and that was wrong rather
# than merely stale: this package hard-imports `@rookery/core` (`src/lib.typ`,
# `src/lookup.typ`), whose own manifest declares the same floor — so a project on
# rheo 0.5.2 satisfied what this said, then failed on the rookery it pulled in.
# The other three packages in the family already said 0.6.0; this was the odd one
# out. Its own readme states the dependency in prose too.
#
# 0.6.1 raises it, and not because the Typst surface moved: it is where rheo
# learned to resolve a namespace it does not ship, via the `[packages.<ns>]`
# table a project needs to say where `@rookery` comes from at all. Without it
# these packages cannot be consumed under their own namespace, and
# `[tool.rheo.source.html]` below is a 0.6.1 manifest key an older rheo reads
# straight past. The floor turns "package not found" into a message naming the
# version.
[tool.rheo]
#
# 0.6.2 raises it again, and this one is the sharpest reason yet: 0.6.1 located
# packages by probing Typst's directory layout in the two places that read a
# package's `.marrow.typ`, and a package fetched from a ref lives at a path keyed
# by its resolved commit, which no probe matches. Every page THIS FAMILY MINTS
# FROM MARROW therefore went missing — on a build that succeeded and warned about
# nothing. Declaring 0.6.2 is what turns that silence into an error naming the
# version.
min_version = "0.6.2"

[tool.rheo.html]
js_scripts = "dist/lib.js"
css_stylesheet = "src/search.css"

[tool.rheo.source.html]
# Every file `src/search.js` reaches via a relative ES import, listed
# dependency-first: rheo's asset copy acts on exactly this list, not on a
# scan of import statements, so a file left out here never lands in the
# output even though the browser's own module graph would have found it.
js_scripts = [
  "src/text.js",
  "src/marks.js",
  "src/tagquery.js",
  "src/score.js",
  "src/row.js",
  "src/preview.js",
  "src/selection.js",
  "src/island.js",
  "src/limit.js",
  "src/keywords.js",
  "src/bar.js",
  "src/modal.js",
  "src/panel.js",
  "src/search.js",
]
js_module = true
